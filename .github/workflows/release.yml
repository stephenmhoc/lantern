name: Release to TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (for example, 1.0.0)'
        required: true
      release_notes:
        description: 'GitHub release notes'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # App Store Connect wants the iOS 27 SDK from April 2027 (ITMS-90725), and macos-26 tops out at
  # Xcode 26.6 with the iOS 26.5 SDK, so Xcode 27 goes first. Its pool sometimes has no machine to
  # give: GitHub then fails the job after about 15 minutes without starting it ("The job was not
  # acquired by Runner of type hosted"). Only in that case the same build runs on macos-26, which is
  # accepted until April 2027 with a warning. A job that started and failed isn't retried there, so a
  # build is never uploaded twice. When the fallback succeeds, the run still shows the first job's
  # failure.
  xcode27:
    name: Xcode 27
    uses: ./.github/workflows/release-build.yml
    with:
      runner: xcode-27
      xcode: /Applications/Xcode_27.2.app  # the same Xcode as local builds
    secrets: inherit

  macos26:
    name: Xcode 26 (fallback)
    needs: xcode27
    if: ${{ !cancelled() && needs.xcode27.outputs.started != 'true' }}
    uses: ./.github/workflows/release-build.yml
    with:
      runner: macos-26
      xcode: /Applications/Xcode_26.6.app
    secrets: inherit
